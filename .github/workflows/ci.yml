name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

defaults:
  run:
    working-directory: Week01/ticket-triage

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Week01/ticket-triage/package-lock.json

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            Week01/ticket-triage/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('Week01/ticket-triage/package-lock.json') }}-${{ hashFiles('Week01/ticket-triage/**/*.ts', 'Week01/ticket-triage/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('Week01/ticket-triage/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit smoke test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: file:./prisma/dev.db
